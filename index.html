<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXO · Project workspace</title>
<link rel="stylesheet" href="style.css">
<!-- Supabase JavaScript SDK CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="brand"><div class="brand-mark">↗</div><div><b>EXO</b><small>PROJECT WORKSPACE</small></div></div>
  <div class="nav-label">WORKSPACE</div>
  <nav id="nav" aria-label="Workspace views">
   <button class="nav" data-view="overview"><span class="symbol">▦</span>Overview</button>
   <button class="nav active" data-view="canvas"><span class="symbol">⌘</span>Drawing board</button>
   <button class="nav" data-view="files"><span class="symbol">▱</span>Files</button>
   <button class="nav" data-view="bom"><span class="symbol">☷</span>Master BOM</button>
   <button class="nav" data-view="gallery"><span class="symbol">▧</span>Photo gallery</button>
   <button class="nav" data-view="resources"><span class="symbol">↗</span>Resources</button>
</nav>
 </aside>
 <main>
  <header class="topbar">
    <div class="breadcrumbs">Workspace <span>›</span><b id="crumb">Exo Project</b></div>
    <div class="topbar-right">
      <span id="save-status" class="status" role="status">Checking auth…</span>
      <button id="login-btn" class="primary" onclick="signInWithGoogle()" style="display:none;">Sign in with Google</button>
      <button id="logout-btn" class="secondary" onclick="signOut()" style="display:none;">Sign out</button>
      <span class="pill">SUPABASE AUTH</span>
    </div>
  </header>
  <div class="content">
   <div class="heading"><div><h1 id="page-title">Exo Collaboration Board</h1></div></div>
   <section id="view"></section>
  </div>
 </main>
</div>
<script src="app.js"></script>
</body>
</html>
