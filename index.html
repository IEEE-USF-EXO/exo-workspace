<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="vJC-hLQfigI2J2u9uNJ6e3xPqVeNTmYOigpKaGX7CGs" />
    <title>EXO · Project workspace</title>
    <link rel="icon" type="image/png" href="content/project-icon.png?v=content-images" />
    <link rel="stylesheet" href="style.css?v=1.0.7" />
    <link rel="stylesheet" href="https://unpkg.com/tldraw@3.15.6/tldraw.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18",
          "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
          "react/jsx-dev-runtime": "https://esm.sh/react@18/jsx-dev-runtime",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/client": "https://esm.sh/react-dom@18/client"
        }
      }
    </script>
    <!-- Supabase JavaScript SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar">
        <div class="brand">
          <button
            id="sidebar-toggle"
            class="brand-mark sidebar-toggle"
            type="button"
            data-action="toggle-sidebar"
            aria-controls="sidebar"
            aria-expanded="true"
            aria-label="Hide navigation"
            title="Click to toggle navigation"
          >
            <img src="content/project-icon.png?v=content-images" alt="EXO project icon" />
            <span class="sidebar-toggle-icon" aria-hidden="true">↔</span>
          </button>
          <div><b>EXO</b><small>PROJECT WORKSPACE</small></div>
        </div>
        <div class="nav-label">WORKSPACE</div>
        <nav id="nav" aria-label="Workspace views">
          <button class="nav active" data-view="overview">
            <span class="nav-icon nav-icon-overview" aria-hidden="true"></span>Overview
          </button>
          <button class="nav" data-view="canvas">
            <span class="nav-icon nav-icon-drawing-board" aria-hidden="true"></span>Drawing board
          </button>
          <button class="nav" data-view="files">
            <span class="nav-icon nav-icon-files" aria-hidden="true"></span>Files
          </button>
          <button class="nav" data-view="bom">
            <span class="nav-icon nav-icon-bom" aria-hidden="true"></span>BOM
          </button>
          <button class="nav" data-view="gallery">
            <span class="nav-icon nav-icon-gallery" aria-hidden="true"></span>Photo gallery
          </button>
          <button class="nav" data-view="resources">
            <span class="nav-icon nav-icon-repo-and-links" aria-hidden="true"></span>Repositories &amp; links
          </button>
        </nav>
      </aside>
      <main>
        <header class="topbar">
          <div class="breadcrumbs">
            <label class="project-context" for="project-context">Project</label>
            <select id="project-context" aria-label="Current project"></select>
            <span aria-hidden="true">›</span><b id="crumb" aria-live="polite">Project files</b>
          </div>
          <div class="topbar-right">
            <span id="save-status" class="status" role="status"
              >Opening local storage…</span
            >
            <button class="text-button" data-action="storage">
              More actions
            </button>
            <button
              id="login-btn"
              class="primary"
              type="button"
              data-action="login"
              style="padding: 6px 11px; font-size: 10px"
            >
              Sign in with Google
            </button>
            <button
              id="logout-btn"
              class="secondary"
              onclick="signOut()"
              style="display: none; padding: 6px 11px; font-size: 10px"
            >
              Sign out
            </button>
          </div>
        </header>
        <div class="content">
          <div id="storage-warning" class="alert hidden" role="alert"></div>
          <div class="heading">
            <div>
              <div id="eyebrow" class="eyebrow">WORKSPACE / DRAWING BOARD</div>
              <h1 id="page-title">Your ideas. Your connections.</h1>
              <p id="page-description">
                Draw freely, place cards, and connect work across teams and
                projects.
              </p>
            </div>
          </div>
          <section id="view"></section>
          <footer class="footer">
            <span>EXO PROJECT WORKSPACE</span
            ><span
              >Local files · Local drawing · Google Drive uploads ·
              <a href="privacy.html">Privacy</a> ·
              <a href="terms.html">Terms</a> ·
              <span id="build-version">v1.0.5</span></span
            >
          </footer>
        </div>
      </main>
    </div>
    <dialog id="dialog">
      <div class="modal">
        <div class="modal-head">
          <h2 id="modal-title"></h2>
          <button class="close" id="close-dialog" aria-label="Close dialog">
            ×
          </button>
        </div>
        <div id="modal-body"></div>
      </div>
    </dialog>
    <input
      id="backup-input"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <input
      id="tldraw-board-restore-input"
      type="file"
      accept="application/json"
      hidden
    />
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="phase1-root" hidden></div>
    <script src="app.js?v=1.0.11"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
